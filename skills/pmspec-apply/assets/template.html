<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%235746c8%27/%3E%3Ctext x=%2710%27 y=%2723%27 fill=%27white%27 font-size=%2722%27%3EP%3C/text%3E%3C/svg%3E">
<title>原型起步模板 · PMSpec</title>
<!-- @pmspec:theme:start -->
<style>
:root {
  color-scheme: light;
  --canvas: #eceef2;
  --surface: #ffffff;
  --muted: #f5f6f9;
  --text: #202434;
  --text-muted: #5e6678;
  --border: #d8dce5;
  --primary: #5746c8;
  --primary-hover: #4434ac;
  --primary-soft: #eeeafd;
  --on-primary: #ffffff;
  --danger: #b42336;
  --danger-soft: #fff0f1;
  --focus: #7866e5;
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
</style>
<!-- @pmspec:theme:end -->
<!-- @pmspec:shared:start -->
<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; padding: 32px 24px; background: var(--canvas); color: var(--text); font: 14px/1.65 var(--font); }
button, input, select, textarea { font: inherit; }
button, a, input { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
a { color: var(--primary); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin-top: 0; }
h1 { font-size: 26px; letter-spacing: -.5px; }
h2 { font-size: 21px; }
h3 { font-size: 16px; }
.page-head { margin: 0 0 28px; }
.eyebrow { color: var(--primary); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.muted { color: var(--text-muted); }
.proto-layout { display: flex; gap: 24px; align-items: flex-start; }
.toc-sidebar { flex: 0 0 200px; position: sticky; top: 24px; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.toc-sidebar a { display: block; margin-top: 14px; text-decoration: none; }
.sections-col { flex: 1; min-width: 0; }
.proto-stack { scroll-margin-top: 24px; margin-bottom: 48px; }
.section-label { font-weight: 700; font-size: 16px; margin-bottom: 12px; }
.proto-with-prd { display: grid; grid-template-columns: minmax(620px, 1fr) 320px; gap: 24px; align-items: start; }
.app-window { height: 650px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 12px 36px #20243412; }
.app-bar { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--muted); }
.app-bar span { font-size: 12px; color: var(--text-muted); }
.app-body { position: relative; display: flex; height: calc(100% - 48px); }
.app-sidebar { flex: 0 0 140px; padding: 24px 16px; border-right: 1px solid var(--border); background: var(--muted); }
.app-sidebar a, .nav-current { display: block; border-radius: 8px; padding: 8px 12px; text-decoration: none; }
.nav-current { color: var(--primary); background: var(--primary-soft); font-weight: 600; }
.app-main { padding: 32px; flex: 1; min-width: 0; overflow: auto; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.toolbar h2 { margin: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); background: var(--surface); text-decoration: none; font-weight: 600; }
.btn:hover { background: var(--muted); }
.btn-primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-danger { color: var(--danger); background: var(--danger-soft); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.card { border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; background: var(--surface); }
.item-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.item-row p { margin: 6px 0 0; }
.badge { background: var(--primary-soft); color: var(--primary); padding: 3px 9px; border-radius: 6px; font-size: 12px; }
.empty { padding: 64px 16px; text-align: center; }
.prd-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; max-height: 650px; overflow: auto; }
.prd-panel h3 { margin-bottom: 16px; }
.prd-panel ul { padding-left: 19px; margin: 0; }
.prd-panel li { margin-bottom: 14px; }
.prd-panel li:last-child { margin-bottom: 0; }
.review-tabs { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.review-tabs > span { font-size: 12px; color: var(--text-muted); margin-right: 4px; }
.review-tab { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.review-tab[aria-selected="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #20243459; padding: 28px; }
.dialog { width: 420px; max-width: 100%; max-height: 100%; overflow: auto; background: var(--surface); padding: 28px; border-radius: var(--radius); box-shadow: 0 16px 48px #20243430; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.dialog-head h3 { margin: 0; }
.drawer { position: absolute; right: 0; top: 0; bottom: 0; width: min(380px, 80%); padding: 28px; background: var(--surface); box-shadow: -8px 0 32px #20243420; overflow: auto; }
.field { margin-bottom: 20px; }
.field label { display: block; font-weight: 600; margin-bottom: 8px; }
.input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); background: var(--surface); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
.error { margin: 8px 0 0; color: var(--danger); font-size: 13px; }
.notice { padding: 12px 16px; margin-bottom: 20px; border-radius: 8px; color: var(--primary); background: var(--primary-soft); }
@media (max-width: 1450px) {
  .proto-with-prd { grid-template-columns: minmax(0, 1fr); }
  .prd-panel { max-height: none; }
}
@media (max-width: 850px) {
  body { padding: 20px 12px; }
  .proto-layout { display: block; }
  .toc-sidebar { position: static; margin-bottom: 24px; }
  .app-sidebar { display: none; }
  .app-main { padding: 24px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}
</style>
<!-- @pmspec:shared:end -->
<!-- @pmspec:runtime:start -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('[data-review-tabs]').forEach((tabGroup) => {
    const section = tabGroup.closest('.proto-stack');
    const tabs = [...tabGroup.querySelectorAll('[role="tab"]')];
    const panels = [...section.querySelectorAll('[data-review-panel]')];
    function selectTab(selectedTab) {
      tabs.forEach((tab) => {
        const selected = tab === selectedTab;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
      panels.forEach((panel) => {
        panel.hidden = panel.dataset.reviewPanel !== selectedTab.dataset.reviewState;
      });
    }
    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectTab(tab));
      tab.addEventListener('keydown', (event) => {
        let nextIndex;
        if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
        if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
        if (event.key === 'Home') nextIndex = 0;
        if (event.key === 'End') nextIndex = tabs.length - 1;
        if (nextIndex === undefined) return;
        event.preventDefault();
        selectTab(tabs[nextIndex]);
        tabs[nextIndex].focus();
      });
    });
    selectTab(tabs.find((tab) => tab.getAttribute('aria-selected') === 'true') || tabs[0]);
  });
});
</script>
<!-- @pmspec:runtime:end -->
</head>

<header class="page-head"><p class="eyebrow">PMSPEC · TEMPLATE</p><h1>原型起步模板</h1><p class="muted">这是结构示例，不是已批准的产品需求。复制后按实际 proposal 替换内容。</p></header>
<div class="proto-layout">
<nav class="toc-sidebar" aria-label="页面索引"><strong>页面索引</strong><a href="#screen-home">01 · 首页</a></nav>
<main class="sections-col">
<section class="proto-stack" id="screen-home" aria-labelledby="heading-home">
<h2 class="section-label" id="heading-home">01 · 首页</h2>
<div class="proto-with-prd">
<div class="app-window"><div class="app-bar"><strong>示例产品</strong><span>网页原型</span></div><div class="app-body"><div class="app-main"><h2>从一个明确的问题开始</h2><p class="muted">本模板展示原型与旁注的一一对应关系。</p><div class="card">在此按已批准需求搭建产品界面。</div></div></div></div>

</div></section>
</main></div>
</body></html>
